name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Verify calendar field filling and reopening
        run: |
          swiftc ios/JBIInspections/Models.swift ios/Tests/CalendarRegression.swift -o "$RUNNER_TEMP/calendar-regression"
          "$RUNNER_TEMP/calendar-regression"
      - name: Compile iPhone simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/JBIInspections.xcodeproj -scheme JBIInspections \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-log
          path: build.log
          retention-days: 14
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: JBIInspections-simulator
          path: build/Build/Products/Debug-iphonesimulator/JBIInspections.app
          retention-days: 14
