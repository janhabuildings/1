# Free testing only: local database, uploads and reports are ephemeral.
services:
  - type: web
    name: jbi-inspections
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INSPECTION_API_TOKEN
        generateValue: true
      - key: INSPECTION_DATA_DIR
        value: /tmp/jbi-inspections
